name: audit-gate

# ─────────────────────────────────────────────────────────────────────────────
# 审计闸门（main 的必需状态检查）
#
# 唯一判定规则：
#   PR 改的文件全部在 people/ 下     → ✅ 免审计，自动通过，作者自己就能点 Merge
#   只要有 1 个文件在 people/ 以外   → ❌ 需要组长 @naruto7 在本 PR 点 Approve，否则合不进去
#
# 为什么这么做：GitHub 分支保护不支持"按路径要求评审"，所以把分流逻辑放进这个检查，
# 再把 audit-gate 设成 main 的必需检查 —— 红着就按不下 Merge。
# 删掉本文件 = 检查不再上报 = 所有 PR 都合不进去（删了也白删）。
# 改本文件本身属于共享区改动，同样要组长审计。
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: audit-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: audit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 判定改动范围并核对审计
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          AUDITOR="naruto7"

          echo "PR #$NUMBER · 作者：$PR_AUTHOR"

          # 1) 改动文件清单。读不到就拦（fail-closed），不放行。
          if ! RAW=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" --jq '.[].filename'); then
            echo "::error::读取本 PR 的改动文件失败，默认拦截（fail-closed），请重跑本检查。"
            exit 1
          fi
          mapfile -t FILES <<< "$RAW"

          SHARED=()
          for f in "${FILES[@]}"; do
            [ -z "$f" ] && continue
            case "$f" in
              people/*) ;;
              *) SHARED+=("$f") ;;
            esac
          done

          # 2) 只动 people/ → 免审计，直接过
          if [ "${#SHARED[@]}" -eq 0 ]; then
            {
              echo "### ✅ 免审计（only people/）"
              echo ""
              echo "本 PR 只动了 \`people/\` 下的个人文件（${#FILES[@]} 个），属于个人上传："
              echo "不需要评审，自己点 **Merge pull request** 就行。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: 只改 people/，免审计"
            exit 0
          fi

          # 3) 动到共享区 → 查当前有效的 Approve（dismissed 不算，新提交会由分支保护清掉旧 approve）
          APPROVERS=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" \
            --jq '.[] | select(.state=="APPROVED") | "\(.user.login)|\(.author_association)"' 2>/dev/null || true)

          HAS_AUDITOR=0
          HAS_PEER=0
          while IFS='|' read -r login assoc; do
            [ -z "$login" ] && continue
            if [ "$login" = "$AUDITOR" ]; then HAS_AUDITOR=1; continue; fi
            case "$assoc" in
              MEMBER|OWNER|COLLABORATOR)
                [ "$login" != "$PR_AUTHOR" ] && HAS_PEER=1
                ;;
            esac
          done <<< "$APPROVERS"

          # 组长本人开共享区 PR 时不能自己 approve 自己 → 由任一其他组员 approve
          if [ "$HAS_AUDITOR" -eq 1 ] || { [ "$PR_AUTHOR" = "$AUDITOR" ] && [ "$HAS_PEER" -eq 1 ]; }; then
            {
              echo "### ✅ 已审计"
              echo ""
              echo "共享区改动已通过审计，可以合并。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: 共享区改动已获得审计 approve"
            exit 0
          fi

          # 4) 其余一律拦
          {
            echo "### ❌ 需要组长审计"
            echo ""
            echo "本 PR 动到了 \`people/\` 以外的共享区："
            echo ""
            printf -- '- `%s`\n' "${SHARED[@]}"
            echo ""
            echo "怎么过："
            echo "1. 如果只是个人素材 / 草稿 → 挪进 \`people/<你的 GitHub 名>/\`，本检查会自动变绿；"
            echo "2. 如果确实要改共享文件 → 群里 @naruto7，等他在本 PR 点 **Approve**，本检查自动变绿。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::共享区改动缺少审计 approve：需要 @$AUDITOR 在 PR 上点 Approve（或把文件移回 people/ 下）。"
          exit 1
