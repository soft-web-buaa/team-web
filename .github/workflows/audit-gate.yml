name: audit-gate

# ─────────────────────────────────────────────────────────────────────────────
# 审计闸门（main 的必需状态检查）
#
# 判定逻辑在 .github/scripts/audit-gate.sh（可单测），规则只有一条：
#   PR 改的文件全部在 people/ 下     → ✅ 免审计，自动通过，作者自己就能点 Merge
#   只要有 1 个文件在 people/ 以外   → ❌ 需要组长 @naruto7 在本 PR 点 Approve，否则合不进去
#
# 为什么这么做：GitHub 分支保护不支持"按路径要求评审"，所以把分流逻辑放进这个检查，
# 再把 audit-gate 设成 main 的必需检查 —— 红着就按不下 Merge。
# 删掉本文件 = 检查不再上报 = 所有 PR 都合不进去（删了也白删）。
# 改本文件本身属于共享区改动，同样要组长审计。
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: audit-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: audit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: 判定改动范围并核对审计
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUDITOR: naruto7
        run: bash .github/scripts/audit-gate.sh
